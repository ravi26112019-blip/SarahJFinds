<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sarah Johnson Finds</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <svg class="bio-card__bg-curve" viewBox="0 0 1440 400">
        <path d="M0,0 H1440 V300 Q720,500 0,300 Z"></path>
    </svg>

    <main class="bio-card">
        <button class="bio-card__share-btn" onclick="sharePage()" aria-label="Share Page">
            <i class="fa-solid fa-arrow-up-from-bracket"></i>
        </button>

        <div class="bio-card__avatar-box">
            <img class="bio-card__avatar-img"
                src="https://ik.imagekit.io/lzl0sgfim/Profile%20Image/Gemini_Generated_Image_kb341ykb341ykb34.png?tr=w-400,q-80,f-auto"
                alt="Profile Image">
        </div>

        <div class="bio-card__user-info">
            <h1 class="bio-card__name">SARAH J. FINDS
                <svg class="verified-tick" height="16" width="16" viewBox="0 0 24 24" fill="none"
                    style="margin-left: 6px; left: 100%; top: 50%; transform: translateY(-50%);">
                    <path
                        d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.79-4-4-4-.495 0-.965.084-1.4.238C14.55 2.475 13.18 1.6 11.6 1.6c-1.58 0-2.95.875-3.6 2.148-.435-.154-.905-.238-1.4-.238-2.21 0-4 1.79-4 4 0 .495.084.965.238 1.4C1.575 9.55.7 10.92.7 12.5c0 1.58.875 2.95 2.148 3.6-.154.435-.238.905-.238 1.4 0 2.21 1.79 4 4 4 .495 0 .965-.084 1.4-.238 1.05 1.273 2.42 2.148 4 2.148 1.58 0 2.95-.875 3.6-2.148.435.154.905.238 1.4.238 2.21 0 4-1.79 4-4 0-.495-.084-.965-.238-1.4 1.273-1.05 2.148-2.42 2.148-4z"
                        fill="#1d9bf0" />
                    <path d="M10.2 16.2l-3.5-3.5 1.4-1.4 2.1 2.1 5.3-5.3 1.4 1.4-6.7 6.7z" fill="#ffffff" />
                </svg>
            </h1>
            <p class="bio-card__desc">Sharing my favorite finds for a curated lifestyle. Home, Tech, Style & more!</p>
            <p class="bio-card__tag">#AmazonCreator💖</p>
        </div>

        <section class="bio-card__links">
            <a class="bio-card__link-item" href="#">SHOP MY STOREFRONT</a>
            <a class="bio-card__link-item" href="#">LATEST FINDS</a>
            <a class="bio-card__link-item" href="#">TECH DEALS</a>
            <a class="bio-card__link-item" href="#">HOME DECOR</a>
        </section>

        <section class="bio-card__socials">
            <i class="fa-brands fa-instagram bio-card__social-icon"></i>
            <i class="fa-brands fa-youtube bio-card__social-icon"></i>
            <i class="fa-brands fa-tiktok bio-card__social-icon"></i>
            <span class="bio-card__handle">@SARAHJFINDS</span>
        </section>

        <span class="bio-card__disclosure">As an Amazon Associate I earn from qualifying purchases.</span>

        <footer class="bio-card__footer">
            <span>amazon.com/shop/sarahjfinds</span>
        </footer>
    </main>

    <script>
        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    url: window.location.href
                }).catch(err => console.log('Share canceled'));
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Link copied to clipboard!");
            }
        }
    </script>
</body>

</html>
